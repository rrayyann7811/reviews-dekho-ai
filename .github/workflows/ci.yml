# Tests, lint and builds on every push and pull request. Lightweight on purpose: the backend uses VADER (the
# ~128 MB sentiment model is never downloaded, so its 10 tests are skipped) and no Ollama (the live AI test skips).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]   # the versions verified locally
    defaults:
      run:
        working-directory: backend
    env:
      SENTIMENT_ENGINE: vader
      AI_SUMMARIES: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Tests (model and live-Ollama tests skip)
        run: python -m pytest -rs
      - name: Demo seed works and is repeatable
        run: |
          python scripts/seed_demo.py --engine vader --db "$RUNNER_TEMP/a-demo.db" --json > "$RUNNER_TEMP/a.json"
          python scripts/seed_demo.py --engine vader --db "$RUNNER_TEMP/b-demo.db" --json > "$RUNNER_TEMP/b.json"
          python - <<'PY'
          import json, os
          a, b = (json.loads(open(os.path.join(os.environ["RUNNER_TEMP"], f)).read().splitlines()[-1]) for f in ("a.json", "b.json"))
          assert a["contentDigest"] == b["contentDigest"], (a["contentDigest"], b["contentDigest"])
          print("demo digest", a["contentDigest"])
          PY
      - name: Synthetic demo files are reproducible
        run: |
          python scripts/make_demo_data.py
          git diff --exit-code -- data/demo

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Production build keeps its API address
        run: npm run check:app-bundle
      - name: Static demo build (not deployed)
        run: npm run build:demo
      - name: Static demo contains no backend address
        run: npm run check:demo-bundle
      - name: Static demo ignores a configured backend address
        env:
          VITE_API_URL: https://backend.example.invalid/api
        run: |
          npm run build:demo
          npm run check:demo-bundle
