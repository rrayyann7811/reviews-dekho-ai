# Publishes the static, demo-only frontend to GitHub Pages. Started by hand only (Actions -> "Deploy static demo" ->
# Run workflow), so nothing is deployed by a push. The FastAPI backend is never built, started or deployed: the demo
# build (Vite mode "staticdemo") makes no network requests and shows only the built-in synthetic demo product.
name: Deploy static demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests (including the static-demo tests)
        run: npm test
      - run: npm run build:demo
      - name: Check the output is the demo-only build
        # No backend address (default or configured), no source maps, no third-party fonts, relative asset paths
        # (so it works under /<repository>/). See frontend/scripts/check-bundle.mjs.
        run: |
          npm run check:demo-bundle
          du -sh dist-demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
