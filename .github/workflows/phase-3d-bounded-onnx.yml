name: Phase 3D bounded native ONNX workloads

on:
  push:
    branches: [phase-3d/bounded-onnx]
    paths:
      - .github/workflows/phase-3d-bounded-onnx.yml
      - backend/scripts/phase_3d_runner.sh
      - backend/scripts/phase_3d_workload.py

permissions:
  contents: read

concurrency:
  group: phase-3d-bounded-onnx
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
          architecture: x64
      - name: Package and test real ONNX under Docker cgroup limits
        run: bash backend/scripts/phase_3d_runner.sh
